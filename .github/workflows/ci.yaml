name: CI

on:
  push: &ci_trigger
    branches:
      - main
    paths:
      - "**.py"
      - "**.json"
      - "**.yaml"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request: *ci_trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    name: "Static Checks (Synced with Local Environment)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check

      - name: Run Ruff Format
        run: uv run ruff format --check

      - name: Run Ty Check
        run: uv run ty check

      - name: Run Pyright
        run: uv run pyright

      - name: Run Interrogate
        run: uv run interrogate

      - name: Run Pytest
        run: uv run pytest

  managed-live-benchmark:
    runs-on: ubuntu-latest
    name: "Managed-Live Benchmark Gate"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Managed-Live Benchmark Gate
        run: >-
          uv run tools/benchmark.py
          --min-intent-slot-accuracy 88.75
          --max-mismatch-rate 1.50
          --min-language-intent-slot-accuracy 85.00
          --max-language-mismatch-rate 3.00

  setup-matrix:
    runs-on: ubuntu-latest
    name: "Setup Compatibility Matrix"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          LATEST_HA=$(curl -s -f --max-time 20 --retry 3 https://pypi.org/pypi/homeassistant/json | jq -r .info.version 2>/dev/null || echo "null")

          if [ "$LATEST_HA" = "null" ]; then
            echo "::error::Failed to fetch latest Home Assistant version"
            exit 1
          fi

          if [[ ! "$LATEST_HA" =~ ^[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
            echo "::error::Invalid Home Assistant version format: $LATEST_HA"
            exit 1
          fi

          jq -e '
            (type == "array") and all(.[]; (
              (type == "object") and
              (.ha_version | type == "string") and
              (.python_version | type == "string") and
              (.ha_version == "latest" or (.ha_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$")))
              and (.python_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$"))
            ))
          ' tools/compatibility_matrix.json >/dev/null

          MATRIX_JSON=$(jq -c --arg latest "$LATEST_HA" '
            map(
              (if .ha_version == "latest" then
                . + {
                  ha_version: ("latest (" + $latest + ")"),
                  ha_real_version: $latest
                }
              else
                . + {
                  ha_real_version: .ha_version
                }
              end
            )
            )
            | {include: .}
          ' tools/compatibility_matrix.json)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  compatibility:
    needs: setup-matrix
    runs-on: ubuntu-latest
    name: ${{ matrix.ha_version && format('Compatibility ({0}, {1})', matrix.ha_version, matrix.python_version) || 'Compatibility' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        shell: bash
        env:
          MATRIX_HA_REAL_VERSION: ${{ matrix.ha_real_version }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          set -euo pipefail

          uv --no-config venv --no-project --python "$MATRIX_PYTHON_VERSION"
          HA_SPEC="homeassistant==$MATRIX_HA_REAL_VERSION"
          HA_CONSTRAINTS_CDN_URL="https://cdn.jsdelivr.net/gh/home-assistant/core@$MATRIX_HA_REAL_VERSION/homeassistant/package_constraints.txt"
          HA_CONSTRAINTS_GITHUB_URL="https://raw.githubusercontent.com/home-assistant/core/$MATRIX_HA_REAL_VERSION/homeassistant/package_constraints.txt"
          fetch_constraints() {
            curl -sS -f --max-time 20 --retry 3 "$HA_CONSTRAINTS_CDN_URL" 2>/dev/null \
              || curl -sS -f --max-time 20 --retry 3 "$HA_CONSTRAINTS_GITHUB_URL"
          }
          HA_CONSTRAINTS=$(fetch_constraints)
          HA_INTENTS_SPEC=$(awk '/^home-assistant-intents==/ {print $1; exit}' <<< "$HA_CONSTRAINTS")
          if [[ ! "$HA_INTENTS_SPEC" =~ ^home-assistant-intents==[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
            echo "::error::Failed to resolve home-assistant-intents from package_constraints.txt (tried CDN and GitHub)"
            exit 1
          fi
          HASSIL_SPEC=$(awk '/^hassil==/ {print $1; exit}' <<< "$HA_CONSTRAINTS")
          if [[ ! "$HASSIL_SPEC" =~ ^hassil==[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
            echo "::error::Failed to resolve hassil from package_constraints.txt (tried CDN and GitHub)"
            exit 1
          fi
          REQUIRED_TEST_DEPS=(
            "$HASSIL_SPEC"
            "$HA_INTENTS_SPEC"
            "pytest"
            "pytest-asyncio"
            "pytest-cov"
            "pytest-homeassistant-custom-component"
            "pytest-timeout"
            "pytest-xdist"
            "rapidfuzz"
          )
          echo "$HA_SPEC" > overrides.txt
          uv --no-config pip install --overrides overrides.txt --python .venv/bin/python "$HA_SPEC" "${REQUIRED_TEST_DEPS[@]}"

      - name: Run Pytest
        run: uv run --no-project --python .venv/bin/python pytest --no-cov -m "not current_intents"
