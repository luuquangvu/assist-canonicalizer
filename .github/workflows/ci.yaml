name: CI

on:
  push: &ci_trigger
    branches:
      - main
    paths:
      - "**.py"
      - "**.json"
      - "**.yaml"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request: *ci_trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    name: "Static Checks (Synced with Local Environment)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run --no-project ruff check

      - name: Run Ruff Format
        run: uv run --no-project ruff format --check

      - name: Run Ty Check
        run: uv run --no-project ty check

      - name: Run Pyright
        run: uv run --no-project pyright

      - name: Run Interrogate
        run: uv run --no-project interrogate

      - name: Run Tests
        run: uv run --no-project pytest

      - name: Run Multilingual Accuracy and Fallback Gate
        run: >-
          uv run --no-project tools/benchmark.py
          --mode accuracy
          --skip-hassil
          --skip-ablations
          --min-intent-slot-accuracy 92.0
          --max-fallback-rate 8.0
          --max-mismatch-rate 2.0
          --min-language-intent-slot-accuracy 90.0
          --max-language-fallback-rate 9.5
          --max-language-mismatch-rate 2.5

  setup-matrix:
    runs-on: ubuntu-latest
    name: "Setup Compatibility Matrix"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          LATEST_HA=$(curl -s -f --max-time 20 --retry 3 https://pypi.org/pypi/homeassistant/json | jq -r .info.version 2>/dev/null || echo "null")

          if [ "$LATEST_HA" = "null" ]; then
            echo "::error::Failed to fetch latest Home Assistant version"
            exit 1
          fi

          if [[ ! "$LATEST_HA" =~ ^[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
            echo "::error::Invalid Home Assistant version format: $LATEST_HA"
            exit 1
          fi

          jq -e '
            (type == "array") and all(.[]; (
              (type == "object") and
              (.ha_version | type == "string") and
              (.python_version | type == "string") and
              (.ha_version == "latest" or (.ha_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$")))
              and (.python_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$"))
              and ((.pinned_test_dependencies // []) | type == "array")
              and all((.pinned_test_dependencies // [])[]; (
                (type == "object")
                and (.package | type == "string")
                and (.version | type == "string")
                and (.package | test("^[a-zA-Z0-9](?:[a-zA-Z0-9._-]*[a-zA-Z0-9])?$"))
                and (.version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$"))
              ))
              and (
                ((.pinned_test_dependencies // []) | map(.package | ascii_downcase | gsub("[._-]+"; "-"))) as $pinned_packages
                | all($pinned_packages[]; . != "homeassistant")
                  and (($pinned_packages | unique | length) == ($pinned_packages | length))
              )
            ))
          ' tools/compatibility_matrix.json >/dev/null

          MATRIX_JSON=$(jq -c --arg latest "$LATEST_HA" '
            map(
              (if .ha_version == "latest" then
                . + {
                  ha_version: ("latest (" + $latest + ")"),
                  ha_real_version: $latest
                }
              else
                . + {
                  ha_real_version: .ha_version
                }
              end)
              | . + {
                pinned_test_dependency_specs: (
                  (.pinned_test_dependencies // [])
                  | map((.package | ascii_downcase | gsub("[._-]+"; "-")) + "==" + .version)
                )
              }
            )
            | {include: .}
          ' tools/compatibility_matrix.json)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  compatibility:
    needs: setup-matrix
    runs-on: ubuntu-latest
    name: ${{ matrix.ha_version && format('Compatibility ({0}, {1})', matrix.ha_version, matrix.python_version) || 'Compatibility' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        shell: bash
        env:
          MATRIX_HA_REAL_VERSION: ${{ matrix.ha_real_version }}
          MATRIX_PINNED_TEST_DEPENDENCY_SPECS: ${{ toJson(matrix.pinned_test_dependency_specs) }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          set -euo pipefail

          uv --no-config venv --no-project --python "$MATRIX_PYTHON_VERSION"
          HA_SPEC="homeassistant==$MATRIX_HA_REAL_VERSION"
          mapfile -t PINNED_TEST_DEPENDENCIES < <(jq -r '.[]' <<< "$MATRIX_PINNED_TEST_DEPENDENCY_SPECS")
          PINNED_HA_INTENTS=false
          for spec in "${PINNED_TEST_DEPENDENCIES[@]}"; do
            if [[ "${spec%%==*}" == "home-assistant-intents" ]]; then
              PINNED_HA_INTENTS=true
              break
            fi
          done
          HA_REQUIREMENTS_CDN_URL="https://cdn.jsdelivr.net/gh/home-assistant/core@$MATRIX_HA_REAL_VERSION/requirements_all.txt"
          HA_REQUIREMENTS_GITHUB_URL="https://raw.githubusercontent.com/home-assistant/core/$MATRIX_HA_REAL_VERSION/requirements_all.txt"
          fetch_requirements() {
            curl -sS -f --max-time 20 --retry 3 "$HA_REQUIREMENTS_CDN_URL" 2>/dev/null \
              || curl -sS -f --max-time 20 --retry 3 "$HA_REQUIREMENTS_GITHUB_URL"
          }
          REQUIRED_TEST_DEPS=(hassil pytest pytest-homeassistant-custom-component rapidfuzz)
          if [[ "$PINNED_HA_INTENTS" == false ]]; then
            HA_REQUIREMENTS=$(fetch_requirements)
            HA_INTENTS_SPEC=$(awk '/^home-assistant-intents==/ {print $1; exit}' <<< "$HA_REQUIREMENTS")
            if [[ ! "$HA_INTENTS_SPEC" =~ ^home-assistant-intents==[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
              echo "::error::Failed to resolve home-assistant-intents from requirements_all.txt (tried CDN and GitHub)"
              exit 1
            fi
            REQUIRED_TEST_DEPS+=("$HA_INTENTS_SPEC")
          fi
          echo "homeassistant==$MATRIX_HA_REAL_VERSION" > overrides.txt
          INSTALL_TEST_DEPS=("${PINNED_TEST_DEPENDENCIES[@]}")
          for dep in "${REQUIRED_TEST_DEPS[@]}"; do
            dep_package="${dep%%==*}"
            pinned=false
            for spec in "${PINNED_TEST_DEPENDENCIES[@]}"; do
              if [[ "${spec%%==*}" == "$dep_package" ]]; then
                pinned=true
                break
              fi
            done
            if [[ "$pinned" == false ]]; then
              INSTALL_TEST_DEPS+=("$dep")
            fi
          done
          uv --no-config pip install --overrides overrides.txt --python .venv/bin/python "$HA_SPEC" "${INSTALL_TEST_DEPS[@]}"

      - name: Run Tests
        run: uv run --no-project --python .venv/bin/python pytest --no-cov -m "not current_intents"
