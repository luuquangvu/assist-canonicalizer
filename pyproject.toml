[project]
name = "assist-canonicalizer"
version = "1.10.0"
description = "Improve Assist intent recognition using lexical canonicalization"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["rapidfuzz>=3.10.0"]

[dependency-groups]
dev = [
  "hassil",
  "home-assistant-intents",
  "homeassistant",
  "interrogate",
  "orjson",
  "packaging",
  "prek",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
  "tomlkit",
  "ty",
]
ha-benchmark = [
  "colorlog",
  "ha-ffmpeg",
  "hassil",
  "home-assistant-frontend",
  "home-assistant-intents",
  "infrared-protocols",
  "isal",
  "mutagen",
  "pymicro-vad",
  "pyspeex-noise",
  "pyturbojpeg",
  "rf-protocols",
]

[tool.uv]
override-dependencies = ["homeassistant>=2026.7.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "PIE", # flake8-pie
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::pytest.PytestDeprecationWarning",
]
markers = [
  "current_intents: tests that assert the current home-assistant-intents corpus or metadata",
]
addopts = [
  "-n",
  "auto",
  "--quiet",
  "--cov=custom_components",
  "--cov-fail-under=90",
  "--cov-branch",
  "--timeout=60",
  "--strict-markers",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.interrogate]
fail-under = 100
ignore-nested-functions = true
exclude = ["scratch"]
